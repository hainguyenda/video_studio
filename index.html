<style>
:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#f6f5f2;--fg:#1c1c20;--card:#fff;--line:#d9d7d0;--mut:#6b6b73;--acc:#c8312b;--onacc:#fff}

body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.5 "Be Vietnam Pro",system-ui,sans-serif}

<section class="card"><div><h1>Xưởng làm phim</h1><p class="s">Dán code từ AI để tạo video hoặc ảnh. Hình vẽ hoàn toàn bằng code, không tốn credit.</p></div>

<script>window.AI_PROMPT="Bạn là đạo diễn phim hoạt hình ngắn KHÔNG LỜI kiểu self-improvement (\"An Animated Short Film\").\nTôi sẽ đưa một chủ đề. Hãy trả về DUY NHẤT một khối JSON (không giải thích, không markdown) dạng:\n{\"shots\":[{\"dur\":5,\"tpl\":\"scene\",\"args\":{...}}, {\"dur\":4,\"tpl\":\"phone\",\"args\":{...}}]}\nQuy tắc:\n- Mỗi cảnh dùng \"dur\" (giây) thay cho start/end. Tổng khoảng 30-60 giây. Không cần \"id\".\n- Chữ trên hình viết bằng tiếng Anh, ngắn, đánh vần chuẩn. Một màu nhấn xuyên suốt.\n- Nhân vật chính nhất quán một preset (hoodie hoặc hero). Bóng đen (who: voice) đứng sau hoặc cạnh, không che mặt nhân vật chính.\n- Chỉ dùng mẫu cảnh (tpl), set, pose, face, fx có trong tài liệu dưới đây. Bỏ qua mọi chỉ dẫn về file, thư mục, lệnh cài đặt.\n- Mọi cảnh có chuyển động (cam đẩy chậm). Cảnh cuối là thẻ kết hoặc cú chốt.\nTài liệu mẫu cảnh và luật hình:\n# Luật hình ngách Self-Improvement (bộ `dem`)\n\nHọc từ các kênh \"An Animated Short Film\" dẫn đầu ngách. Chỉ học **phong cách và nhịp**, mọi hình đều do code của mình vẽ.\n\n## Cấu hình dự án\n- `config.json`: `\"pack\": \"dem\"`, `\"style\": \"flat\"`, `\"accent\": \"red\" | \"pink\" | \"amber\" | \"teal\"` (lấy từ file 01).\n- 16:9 tự có **dải đen điện ảnh 2.39:1** (`\"bars\": \"scope\"`). Mọi chữ, bộ đếm tự nằm trong vùng hình. Muốn bỏ: `\"bars\": \"none\"`.\n- 9:16: không dải đen, chữ to hơn, nhân vật đặt giữa (`x` 0.35–0.65).\n\n## Màu và nét\n- Nền rất tối (#141418 → #1d1e24). Đồ vật tô phẳng xám xanh tối, **nét viền mảnh màu sáng** (#c9ccd4). Không viền đen dày.\n- Nhân vật màu kem #ece6d6, nét xám mảnh, bóng mềm nửa sau.\n- Ánh sáng là các vầng tròn mềm: đèn bàn vàng, màn hình xanh, trăng, cửa neon. Mỗi cảnh **1 nguồn sáng chính**.\n- **Màu nhấn chỉ dùng cho:** bóng đen cám dỗ, chữ cám dỗ, số bộ đếm sau khi sụp, gạch chân thẻ kết, dòng phụ 2 thẻ kết, băng đô khi tập. Không tô màu nhấn lên vật khác.\n\n## Nhân vật\n- Nhân vật chính giống đối thủ: **đầu tròn trơn màu kem, không tóc, không đội gì trên đầu**. `hoodie` là mũ hạ sau cổ; chỉ dùng `hooded` (trùm mũ) khi cảnh thật sự cần.\n- Đề tài thức đêm / nghiện / kiệt sức: dùng mắt đỏ gân máu (`face: \"bloodshot\"` hoặc `\"bloodshot\": true`) ở các cảnh đáy và cận mặt, giống thumbnail.\n- Nhân vật chính 1 preset suốt phim: `hoodie` (nghiện, đêm), chuyển `band` khi bắt đầu tập luyện (nhịp đứng lên) — đó là dấu hiệu thay đổi. Hoặc `hero` trần cho đề tài kỷ luật.\n- **Bóng đen (`voice`)**: luôn cao hơn nhân vật chính một chút, đứng sau / cạnh / ngồi trên giường, cười (`grin`). Nhịp sa ngã: to, gần, tay đặt lên vai (`reach`). Nhịp đứng lên: nhỏ dần (`scale` 0.8 → 0.5), mờ dần (`out`), cuối cùng vỡ (`fx: shards` + `glass_shatter`).\n- Bạn bè đội mũ màu, cô gái tóc bob khăn vàng: chỉ xuất hiện ở khoảnh khắc người thật (bước ngoặt), luôn trong ánh sáng ấm.\n\n## Bố cục\n- Nhân vật chính ở 1/3 trái hoặc phải, không đứng chính giữa trừ cảnh cô đơn (`void`, `hill`).\n- Chữ kể chuyện ở trên, không đè lên mặt. Nếu đè, đặt `pos: \"bottom\"`.\n- Chữ cám dỗ cạnh bóng đen, không đè lên mặt nhân vật chính.\n- Bộ đếm luôn ở góc trên trái, cùng cỡ, cùng chỗ suốt phim.\n\n## Máy quay và nhịp\n- **Mọi cảnh đều có chuyển động**: đẩy chậm (`cam` zoom 1.0 → 1.1–1.3), nhân vật thở / chớp mắt (tự động), bóng đen nhịp sáng, chữ gõ.\n- Cảnh 3–8 giây; montage (lịch, bộ đếm chạy, chạy bộ) 4–6 giây; khoảnh khắc lặng 4–6 giây trên nền đen hoặc cận mặt.\n- Lặp lại **cùng một bố cục phòng ngủ** 4–8 lần trong phim, chỉ đổi giờ đồng hồ, lịch, ánh sáng, vị trí bóng đen → người xem thấy thời gian trôi.\n- Cắt cứng là chính. `dip` (mờ đen 0,5–0,7 giây) giữa các nhịp lớn. `flash` 1 lần ở bước ngoặt.\n\n## Cận cảnh\n- Điện thoại: chiếm gần hết chiều cao, 2 tay cầm, chữ kể chuyện tự đặt bên phải. Feed lướt nhanh cho \"nghiện\", chat cho \"người thật\", email cho \"cái giá\".\n- Đồng hồ / lịch: dùng cho thời gian trôi và cú sụp (`timeAt`, `reset`).\n- Cận mặt: dùng 2–4 lần mỗi phim, ở câu đau nhất và lúc quyết định.\n\n## Nội dung nhạy cảm\n- Lust: chỉ màn hình phát sáng, khối màu mờ, bóng neon. Không vẽ cơ thể, không chữ thô.\n- Tự hại / tự tử: không minh hoạ thuốc, dao, độ cao, dây. Chọn hình ẩn dụ (bóng tối, căn phòng trống) và luôn kết bằng ánh sáng, người thật.\n\n\n# Mẫu cảnh của bộ `dem`\n\nMỗi cảnh trong `story/shots.json`: `{ \"id\", \"start\", \"end\", \"tpl\", \"args\", \"in\", \"sfx\", \"notes\" }`.\n- **Toạ độ** `x`, `y`: số 0..1 = tỉ lệ khung (0.5 = giữa); số > 1.5 = px trên khung 1920×1080. **Cỡ** `h`, `s`: 0..1 = tỉ lệ chiều cao khung.\n- **Thời gian** `at`, `dur`, `out`: giây tính từ đầu cảnh.\n- Thiếu mẫu / sai tên → khung đỏ \"THIEU MAU\". Xem mọi mẫu trong `projects/selfimprove-mau`.\n\n## Lớp phủ chung (mọi mẫu)\n\n### `texts` — chữ\n```json\n\"texts\": [\n  { \"kind\": \"narr\", \"t\": \"Tomorrow sounded reasonable.\", \"at\": 0.4, \"dur\": 4.2 },\n  { \"kind\": \"tempt\", \"t\": \"start tomorrow.\", \"at\": 0.6 },\n  { \"kind\": \"say\", \"t\": \"hi.\", \"who\": \"girl\", \"at\": 1.0 },\n  { \"kind\": \"big\", \"t\": \"3 hours later...\", \"at\": 0.3 }\n]\n```\n- `narr`: chữ kể chuyện trắng, cỡ 58 (dọc 64). `pos`: `top` (mặc định) | `bottom` | `center`; hoặc `x`, `y`. `type: true` = gõ từng chữ. `emph: {\"zero\": \"#ffb03b\"}` = tô màu 1 từ. Ở mẫu `phone`, chữ kể chuyện tự đặt bên phải điện thoại.\n- `tempt`: giọng cám dỗ, chữ viết tay màu nhấn, tự gõ từng chữ, tự đặt trên đầu bóng đen (hoặc bên cạnh nếu sát mép trên). Muốn đặt tay: `x`, `y`. `\"\\n\"` để xuống dòng. `size` nhỏ dần ở nhịp \"yếu dần\" (62 → 44 → 30), `color` mờ dần (`\"#ffb03b88\"`).\n- `say`: bong bóng trắng nhỏ trên đầu người nói (`who`: preset của actor; mặc định người đầu tiên).\n- `big`: chữ nhấn rất to (112), trắng viền xám nổi, giữa màn — dùng cho câu chốt trên màn đen.\n- `sign`: chữ viết tay tự do (`x`, `y`, `size`, `color`).\n\n### `hud` — bộ đếm góc trái\n```json\n\"hud\": { \"rows\": [ { \"label\": \"DAY\", \"n\": 47 } ] }\n\"hud\": { \"rows\": [ { \"label\": \"DAY\", \"from\": 3, \"to\": 30, \"at\": 0.3, \"dur\": 4 } ] }          // đếm dần\n\"hud\": { \"rows\": [ { \"label\": \"DAY\", \"n\": 412, \"reset\": { \"at\": 1.5, \"to\": 0 } } ] }          // gạch về 0, số mới màu nhấn\n\"hud\": { \"rows\": [ { \"label\": \"SEEN\", \"n\": 1388, \"accent\": true }, { \"label\": \"KNOWN\", \"n\": 0 } ] }\n```\nSố tự có dấu phẩy nghìn (`comma: false` để tắt).\n\n### `cam` — máy quay\n`\"cam\": { \"from\": [x, y, zoom], \"to\": [x, y, zoom], \"at\": 0, \"dur\": <hết cảnh>, \"ease\": \"sine\" | \"linear\" }` — `x, y` là điểm nhìn (0..1). Mặc định đẩy rất nhẹ (zoom 1 → 1.05). `\"shake\": [{ \"at\": 1.6, \"amt\": 1, \"dur\": 0.45 }]` rung máy.\n\n### `fx` — hiệu ứng\n`[{ \"kind\": ..., \"at\": giây, \"dur\": giây, \"x\", \"y\", \"color\" }]`\n- `shards`: bóng đen vỡ thành mảnh sáng (mặc định ở vị trí bóng đen). Đi kèm `out` của actor voice cùng giây.\n- `flash`: chớp trắng. `pulse`: viền đập nhịp màu nhấn (`speed`, `a`). `dark`: tối dần (`a`). `glitch`: nhiễu sọc.\n- `speed`: vệt tốc độ (chạy, đấm; `dir` 1 / -1). `zzz`: chữ z bay. `embers`: tàn lửa bay lên. `rain`, `dust`: mưa, bụi. `spot`: đốm sáng (`r`, `color`).\n\n### `lights` — đèn thêm\n`[{ \"x\": 0.7, \"y\": 0.6, \"r\": 0.3, \"color\": \"#ffc56b\", \"a\": 0.35 }]`\n\n### `vignette`: số 0..1 (mặc định 0.5) hoặc `false`.\n\n## `scene` — bối cảnh + nhân vật + bóng đen\n```json\n{ \"tpl\": \"scene\", \"args\": {\n  \"set\": \"bedroom\",\n  \"setArgs\": { \"clock\": \"5:00\", \"ring\": true, \"calendar\": { \"month\": \"OCT\", \"fill\": 12, \"mode\": \"x\" }, \"lamp\": true, \"laptop\": true, \"sky\": \"moon\" },\n  \"bed\": { \"face\": \"sleep\", \"faceAt\": [[1.2, \"tired\"]], \"arm\": { \"at\": 1.5 }, \"zzz\": true },\n  \"actors\": [\n    { \"who\": \"hoodie\", \"x\": \"bed.sit\", \"pose\": \"sitphone\", \"hold\": \"phone\", \"face\": \"tired\", \"glowFace\": \"#9fb6ff\" },\n    { \"who\": \"voice\", \"x\": 0.62, \"pose\": \"reach\", \"facing\": -1, \"at\": 0.5, \"out\": 4.0 }\n  ],\n  \"cam\": { \"from\": [0.5, 0.55, 1.1], \"to\": [0.45, 0.55, 1.25] },\n  \"texts\": [ { \"kind\": \"tempt\", \"t\": \"one more.\", \"at\": 0.8 } ]\n} }\n```\n\n### Bối cảnh (`set`) và `setArgs`\n| set | setArgs | mốc đặt nhân vật |\n|---|---|---|\n| `bedroom` | `clock` (\"3:17\"), `ring`, `blink`, `calendar` {month, fill, mode `x`/`fill`, color} hoặc `false`, `lamp`, `laptop` (true / \"off\"), `sky` (`moon` `dawn` `rain` `night` `dark` `day`), `window: false`, `desk: false`, `door`, `doorOpen` (0..1), `bedX` | `bed.sit` (mép giường), `bed.head`, `desk.seat` (ghế bàn), `clock` |\n| `city` | `time` (`dusk` `night` `dawn` `day`), `birds`, `lamps` [x...], `scroll` (đường chạy trôi) | — |\n| `street` | `neonDoor` (x, cửa cám dỗ phát sáng), `busstop: false`, `busX`, `lampX`, `rain: false` | `bus.seat`, `neon` |\n| `lockers` | `board: false`, `boardX` | — |\n| `classroom` | `sky`, `board` (chữ trên bảng), `desks` [x...] | — |\n| `court` | `hoopX`, `benchX` | `bench` |\n| `cafe` | `lampX` | `table.left`, `table.right` |\n| `gym` | `bag: false`, `bagX`, `swing`, `barbell`, `barbellX`, `spot` | — |\n| `stairs` | `top: false`, `topColor` | `step:0` … `step:8` |\n| `hill` | — | `top` (đỉnh đồi) |\n| `mirror` | `mirrorX` | `mirror` |\n| `kitchen` | `sky`, `lamp` | — |\n| `doorway` | `doorX`, `doorOpen` | `door` |\n| `void` | `spot` (x đèn rọi) | — |\n| `black` | — | — |\nChung: `gy` (mặt sàn 0..1), `dim` (0..1 làm tối).\n\n### `bed` — nhân vật nằm trong chăn\n`{ \"who\": \"hero\", \"face\": \"sleep\", \"faceAt\": [[giây, mặt]], \"look\", \"rot\", \"arm\": true | { \"at\", \"dur\" } (với tay về đồng hồ), \"zzz\": true }`. Chỉ dùng với `set: bedroom`.\n\n### `actors` — nhân vật\n| khoá | ý nghĩa |\n|---|---|\n| `who` | `hero` (trần), `band` (băng đô màu nhấn), `hoodie` (hoodie xám, mũ hạ sau cổ, đầu tròn trơn — mặc định), `hooded` (trùm mũ lên đầu, chỉ khi cảnh cần), `friend` `friend2` `friend3` (mũ vàng / xanh / đỏ), `girl` (tóc bob, khăn vàng), `mom`, `dad`, `kid`, `ghost` (mờ), `voice` (bóng đen cám dỗ) |\n| `x`, `y` | vị trí chân (số hoặc mốc bối cảnh) |\n| `h` | chiều cao (mặc định 0.42; voice 0.48) |\n| `pose`, `poseAt` | tư thế; `poseAt: [[1.5, \"cheer\"]]` đổi theo giây |\n| `face`, `faceAt` | biểu cảm (voice mặc định `grin`) |\n| `facing` | 1 nhìn phải, -1 nhìn trái. `look` -1..1 lệch mắt, `lookAt` |\n| `walk` / `run` | `{ \"to\": 0.8, \"at\": 0, \"dur\": 4, \"speed\": 0.9 }` — tự quay mặt theo hướng đi |\n| `hold` | `phone` (màn hình phát sáng; `screen` màu), `umbrella`, `book`, `ball`, `bag`, `cup` |\n| `glowFace` | màu ánh sáng hắt lên mặt (điện thoại `#9fb6ff`, cảm dỗ = màu nhấn) |\n| `at`, `out`, `fade` | hiện ở giây, biến mất ở giây (mờ dần trong `fade`) |\n| `behind` | vẽ sau giường / nhân vật khác |\n| `scale`, `rot`, `z`, `seed` | phóng, nghiêng, thứ tự vẽ, lệch nhịp chớp mắt |\n| `tears`, `sweat`, `shoes`, `bloodshot` | nước mắt, mồ hôi, màu giày, mắt đỏ gân máu |\n\n**Tư thế (`pose`):** `stand relaxed slump phone reach point wave cheer fist headhold facepalm arms shrug hug guard punch lift sit sitphone sitdesk sitsad knees kneel crouch climb open umbrella carry`.\n**Biểu cảm (`face`):** `neutral tired sleepy sleep sad cry worried scared shock angry determined effort smile happy smirk empty guilty bloodshot haunted grin`. `bloodshot` / `haunted` = lòng trắng hồng, gân đỏ, quầng thâm (thức đêm, nghiện, kiệt sức). Thêm `\"bloodshot\": true` vào actor (hoặc mẫu `face`) để giữ mắt đỏ với bất kỳ biểu cảm nào.\n\n## `phone` — điện thoại cận cảnh, 2 tay cầm\nChung: `bg` (bối cảnh mờ phía sau, vd `\"bedroom\"`), `setArgs`, `hands` (false để ẩn tay; mặc định 4 ngón tay trái ôm mép + ngón cái phải có tay áo), `thumb` (ngón cái nhún như đang lướt), `tilt`, `clock` (giờ thanh trạng thái), `sleeve` (màu tay áo), `h`, `x`, `y`.\n| `screen` | args riêng |\n|---|---|\n| `feed` | `posts`: danh sách ảnh bài đăng minh hoạ, mỗi lần 1 bài, giữ `hold` giây (1.1; lướt nhanh 0.5–0.7) rồi vuốt lên. Ảnh có sẵn: `ramen car burger pizza sneakers dog cat beach mountain sunset gym watch money game coffee city party selfie girl donut cake` (`girl` = bóng neon kín đáo, `neon` đổi màu). `style: \"blocks\"` = kiểu khối màu mờ cũ |\n| `reel` | `art` (1 ảnh minh hoạ như feed, đặt giữa màn), `from` (giây đang xem), `total` (tổng giây), `speed`, `color` |\n| `chat` | `name`, `avatar` (màu), `messages: [{ \"text\", \"me\": true/false, \"at\" }]` (trước tin đến có dấu \"đang gõ\"), `seen` (giây hiện \"Seen\"), `keyboard`, `draft` + `draftAt` (gõ dở trong ô nhập) |\n| `email` | `rows: [{ \"from\", \"subject\", \"preview\", \"hl\": true }]` hoặc `from`, `subject`, `preview` |\n| `lock` | `time`, `date`, `notes: [{ \"app\", \"text\", \"at\" }]` |\n| `counter` | `n`, `label` (\"CLEAN STREAK\"), `color` |\n| `off` | `reflect` (bóng mặt mờ trên màn tắt) |\n\n## `clock` — đồng hồ báo thức to\n`{ \"time\": \"11:59\", \"timeAt\": [[1.6, \"12:00\"]], \"ring\": true, \"blink\": true, \"color\": \"#ff3b30\", \"s\": 0.55 }`\n\n## `calendar` — lịch to\n`{ \"month\": \"NOV\", \"from\": 0, \"to\": 24, \"mode\": \"x\" | \"fill\", \"at\": 0.3, \"dur\": 3, \"reset\": { \"at\": 3.5 }, \"color\" }`\n\n## `face` — cận mặt (từ ngực lên)\n`{ \"who\": \"hoodie\", \"face\": \"guilty\", \"faceAt\": [[2, \"cry\"]], \"bloodshot\": true, \"look\": -0.3, \"lookAt\", \"pose\", \"hold\", \"tears\", \"sweat\", \"glowFace\": \"#9fb6ff\", \"bg\": \"bedroom\", \"setArgs\", \"actors\": [voice...], \"lights\" }`\n\n## `note` — sổ tay, tay viết chữ\n`{ \"text\": \"day 1.\\nno phone before noon.\", \"at\": 0.3, \"cps\": 9, \"sleeve\" }`\n\n## `black` — nền đen + chữ\n`{ \"texts\": [...], \"dust\": true, \"cy\": 0.43, \"line\": true }` — chữ to **giữa màn** (kiểu kênh mẫu): dòng `narr` cỡ 78, dòng `big` cỡ 112 chữ trắng viền xám nổi; các dòng không ghi `y` tự xếp dọc quanh `cy`. `line` = vạch ngắn màu nhấn phát sáng ở đáy (mặc định bật, `false` để tắt). Không có vignette; bộ đếm chỉ hiện nếu ghi `hud`.\n\n## `card` — thẻ kết\n`{ \"word\": \"TOMORROW.\", \"part\": \"PART 2\", \"sub\": \"Tomorrow is a place.\", \"sub2\": \"Nobody lives there.\", \"sub2At\": 3.0, \"type\": true, \"typeDur\": 1.2, \"size\" }` — từ khoá gõ từng chữ, gạch chân màu nhấn, `sub` trắng, `sub2` màu nhấn.\n\n## `cta` — xin like / subscribe\n`{ \"line\": \"If this hit, like and subscribe.\", \"line2\": \"Day 1 starts tonight.\", \"who\": \"hoodie\" }` — nút LIKE, SUBSCRIBE có con trỏ bấm, nhân vật vẫy tay.\n\n## Thumbnail (`scenes/shots/thumb.js`)\n`thumb({ img: 'T01', title | lines, accent: [từ], strike: 'số', y: 0.16, size, arc, rot, align: 'left', x, focus: [x, y], crop })` — font tròn cực đậm, trắng, viền đen dày, bóng đổ; từ trong `accent` đổi màu nhấn; `strike` gạch xoá một từ.\n\n\nÂM THANH (phim không lời: nhạc và hiệu ứng là giọng kể, phải có):\n- Mỗi cảnh có thể có \"music\": một trong sad | dark | rise | resolve | hope | none. Nhạc giữ nguyên cho đến cảnh có \"music\" mới; cảnh không ghi thì giữ nhạc cũ. Chỉnh to nhỏ: \"music\": {\"bed\":\"dark\",\"gainDb\":-3}.\n  Nhịp nhạc gợi ý: sad (mở đầu, sa ngã) → dark (đáy, cám dỗ thắng, nên gainDb -3) → none 1 cảnh lặng sau câu đau nhất → hope (bước ngoặt, khoảnh khắc người thật) → rise (đứng lên, tập luyện) → resolve (thẻ kết). Cảnh đầu tiên phải có \"music\".\n- Mỗi cảnh có thể có \"sfx\": [{\"at\":1.2,\"name\":\"tempt_swell\",\"gain\":-8}]. \"at\" là giây tính từ đầu cảnh, \"gain\" là dB (mặc định -8; tiếng UI nhỏ -12 đến -16, khoảnh khắc lớn -3 đến -6).\n- Tên hiệu ứng hợp lệ (chỉ dùng các tên này): alarm_beep, alarm_long, glass_shatter, rain_loop, notif_msg, msg_sent, punch_bag, boom_deep, tempt_swell, tempt_whisper, clock_tick, footsteps, door_open, breath_in, sting_low, page_flip, whoosh_fast, whoosh_mid, whoosh_long, whoosh_tiny, whoosh_reverse, impact_heavy, impact_light, impact_punch, flash_hit, ding_high, ding_soft, ting_idea, pop, pop_low, tick, ui_click, type_key, typing_2s, riser_2s, riser_4s, downer, heartbeat, glitch, thud_soft, phone_vibrate.\n- Quy ước: bóng đen nói → tempt_swell (câu mạnh) hoặc tempt_whisper (câu nhẹ) ngay lúc chữ cám dỗ bắt đầu gõ; cú sụp bộ đếm → sting_low hoặc boom_deep đúng giây reset; bóng đen vỡ → glass_shatter cùng giây với fx shards; bước ngoặt → notif_msg hoặc breath_in rồi im; đứng lên → riser_2s rồi impact_light; tập luyện → punch_bag, footsteps; lướt feed → whoosh_mid; lịch / bộ đếm trôi → page_flip hoặc tick; báo thức → alarm_beep; mưa → rain_loop. Mỗi 1 đến 2 cảnh có một tiếng, không chồng quá 2 tiếng cùng lúc.";window.AI_PROMPT2="Bạn là họa sĩ viết code cho \"Xưởng phim ngắn\". Nhiệm vụ: viết code để tạo LOGO, BANNER, THUMBNAIL (ảnh tĩnh) hoặc NHÂN VẬT riêng theo yêu cầu của tôi. Chỉ trả về MỘT khối JSON duy nhất, không giải thích dài dòng.\n\nKHUNG JSON:\n{\"chars\": {\"mochi\": {\"code\": \"...thân hàm vẽ nhân vật...\"}},\n \"shots\": [{\"dur\": 1, \"tpl\": \"code\", \"args\": {\"bg\": \"#0b0b10\", \"code\": \"...thân hàm vẽ cả ảnh...\"}}]}\n- \"chars\" chỉ cần khi tôi muốn nhân vật mới. Nhân vật dùng trong cảnh phim bằng {\"tpl\":\"scene\",\"args\":{\"actors\":[{\"who\":\"mochi\",\"x\":0.6,\"h\":0.2}]}} hoặc trong ảnh bằng u.bean(g, x, y, h, {who:\"mochi\"}).\n- Ảnh tĩnh: \"dur\": 1 và tpl \"code\". Muốn ảnh động (logo chuyển động) thì tăng \"dur\" và dùng biến thời gian lt.\n- Trong JSON, code là một chuỗi: dùng \\n cho xuống dòng, và dấu nháy đơn ' bên trong code (tránh dấu nháy kép \").\n\nKÍCH THƯỚC (toạ độ logic, ứng dụng tự phóng to khi xuất):\n- 16:9 (thumbnail YouTube 1280×720, banner 2560×1440): rộng 1920, cao 1080.\n- 9:16 (ảnh dọc, Shorts): rộng 1080, cao 1920.\n- 1:1 (logo vuông): 1080×1080.\nBanner YouTube: chữ và logo chính phải nằm trong vùng an toàn giữa, rộng khoảng 1160 và cao khoảng 320 (ở toạ độ 1920×1080), căn giữa. Thumbnail: chữ lớn, tối đa 3 đến 5 từ, tránh góc dưới bên phải (bị che bởi số giờ phút).\n\nMÔI TRƯỜNG VẼ CHO ẢNH (\"code\" trong args) là thân một hàm có tham số (g, lt, u, a):\n- g: canvas 2D context bình thường (fillRect, arc, bezierCurveTo, ellipse, createLinearGradient, clip, ...).\n- lt: giây từ đầu cảnh. u.t cũng là giờ này, u.p là tiến độ 0..1, u.dur là độ dài cảnh, u.W và u.H là kích thước, u.vertical.\n- u.text(g, \"chữ\", x, y, {size, font, weight, color, align:'left|center|right', base, spacing, stroke, strokeColor, glowColor, a, italic}).\n- Phông chữ: u.FONT_THUMB (đậm to kiểu thumbnail), u.FONT_NARR (kể chuyện), u.FONT_HAND (chữ viết tay), u.FONT_UI (gọn sạch), u.FONTS.title.\n- MÀU NHẤN: u.accent() trả về mã màu hex mà tôi chọn ở ô \"Màu nhấn\" (đỏ, hồng, vàng cam hoặc xanh lục lam). Mọi chi tiết nổi bật (chữ chính, viền, ánh sáng, dải màu) phải dùng u.accent() thay vì viết cứng màu đỏ, để tôi đổi màu là cả ảnh đổi theo. Dùng u.alpha(u.accent(), 0.5) khi cần bản trong suốt.\n- u.linGrad(g,x0,y0,x1,y1,[[0,'#..'],[1,'#..']]), u.radGrad(g,x,y,r0,r1,stops), u.rng(seed) trả về hàm ngẫu nhiên 0..1, u.noise, u.clamp, u.lerp, u.ease.sine, u.alpha('#ff0000',0.5), u.shade.\n- u.bean(g, xChân, yChân, chiềuCao, {who, pose, face, facing, t}) vẽ nhân vật có sẵn. who: hero, band, hoodie, hooded, friend, friend2, friend3, girl, mom, dad, kid, ghost, voice, hoặc nhân vật bạn tự tạo trong \"chars\". pose: stand, relaxed, slump, phone, reach, point, wave, cheer, fist, headhold, facepalm, arms, shrug, hug, guard, punch, lift, sit, sitphone, sitdesk, sitsad, knees, kneel, crouch, climb, open, umbrella, carry. face: neutral, tired, sleepy, sad, cry, worried, scared, shock, angry, determined, effort, smile, happy, smirk, empty, guilty, grin. facing: 1 nhìn phải, -1 nhìn trái.\n- Lớp phủ có sẵn trong args: texts [{kind:'narr',t:'...',at:0.5,dur:5,type:true,pos:'bottom'}], hud, fx. Với ảnh tĩnh bạn nên tự vẽ chữ bằng u.text.\n\nNHÂN VẬT TỰ VẼ (\"chars.id.code\") là thân hàm có tham số (g, x, y, h, o, u, U):\n- (x, y) là điểm GIỮA CHÂN nhân vật (đứng trên mặt đất), h là chiều cao toàn thân, U = h/100 (đơn vị nhỏ: vẽ mọi kích thước nhân với U để nhân vật co giãn đúng).\n- o.facing (1 nhìn phải, -1 nhìn trái, hãy lật hình theo đó), o.t (giây, dùng để thở, chớp mắt, đung đưa), o.walk (số khác 0 nghĩa là đang đi: nên lắc chân tay), o.pose, o.face (có thể dùng để đổi hình).\n- Có thể return {head:[x,y], R: bánkính} để chữ và hiệu ứng bám theo đầu.\n- Nhân vật phải có bóng nhỏ dưới chân, mắt chớp theo o.t, thân hơi nhấp nhô để trông sống động. Mọi màu viết sẵn trong code.\n\nQUY TẮC: chỉ dùng canvas thuần; không mạng, không DOM, không eval, không import. Code ngắn gọn, đẹp, tương phản mạnh, tối đa 2 màu nhấn. Chữ trên hình viết tiếng Anh nếu tôi không nói khác. Nếu yêu cầu của tôi còn thiếu (kênh tên gì, màu gì, chữ gì), hãy tự chọn hợp lý thay vì hỏi lại nhiều.\n";window.AI_PROMPT3="Tôi đính kèm HÌNH một nhân vật. Hãy quan sát kỹ hình (hình dáng đầu, tỉ lệ cơ thể, màu da, tóc, áo, quần, giày, màu viền, độ dày nét, phụ kiện) rồi viết code canvas vẽ lại nhân vật GIỐNG HÌNH NHẤT CÓ THỂ, để dùng trong app làm phim hoạt hình 2D. Tên nhân vật: \"[điền tên, viết liền không dấu, ví dụ mimi]\".\n\nCHỈ TRẢ VỀ MỘT KHỐI JSON, không giải thích:\n{\"chars\":{\"[tên]\":{\"code\":\"...thân hàm...\"}}}\n(trong JSON, code là một chuỗi: dùng \\n xuống dòng, chỉ dùng dấu nháy đơn ' bên trong code, tránh dấu nháy kép \")\n\nTHÂN HÀM CÓ CÁC THAM SỐ: (g, x, y, h, o, u, U)\n- g là canvas 2D context. (x, y) là điểm GIỮA HAI CHÂN trên mặt đất. h là chiều cao toàn thân. U = h/100: mọi kích thước phải nhân với U để nhân vật co giãn đúng.\n- o.facing: 1 là nhìn phải, -1 là nhìn trái (hãy lật hình theo o.facing, nhân toạ độ ngang với f = o.facing ?? 1).\n- o.t: số giây, dùng cho thở, chớp mắt (khoảng 3 giây chớp một lần), đung đưa.\n- o.pose: tên dáng. o.face: tên nét mặt. o.hold: vật cầm (\"phone\" hoặc \"book\"). o.walk và o.run: số khác 0 nghĩa là đang đi hoặc chạy, hãy lắc chân tay theo Math.sin(o.t * tốc độ).\n- Có thể return {head:[x,y], R: bán kính đầu} để chữ và hiệu ứng bám theo đầu.\n- u.bean, u.text, u.linGrad... có sẵn nhưng thường không cần.\n\nCÁCH LÀM ĐỂ NHIỀU DÁNG ĐỀU ĐẸP:\n1. Chia nhân vật thành bộ phận: đầu, thân, hai tay, hai chân. Viết hàm con vẽ một chi từ khớp với GÓC (ví dụ limb(x0,y0,gócĐùi,gócCẳng,độDài)). Mỗi dáng chỉ là một bảng góc khác nhau, không vẽ lại từ đầu.\n2. Phải hỗ trợ các dáng (o.pose): stand, relaxed, slump, phone, reach, point, wave, cheer, fist, headhold, facepalm, arms, shrug, hug, guard, punch, lift, sit, sitphone, sitdesk, sitsad, knees, kneel, crouch, climb, open, umbrella, carry. Nếu gặp tên lạ thì dùng dáng đứng (stand). Dáng sitdesk, sitphone, sit: vẽ tư thế ngồi, mông ngang điểm (x, y). knees, kneel: quỳ. punch: đấm. headhold, facepalm: tay ôm đầu. walk và run: chân tay lắc luân phiên.\n3. Phải hỗ trợ các nét mặt (o.face): neutral, tired, sleepy, sad, cry, worried, scared, shock, angry, determined, effort, smile, happy, smirk, empty, guilty, bloodshot, haunted, grin. Chỉ cần đổi mắt, lông mày, miệng. Có thể gộp nhóm: vui (smile, happy, grin, smirk), buồn (sad, cry, guilty, worried), mệt (tired, sleepy, empty, bloodshot, haunted), căng thẳng (angry, determined, effort, shock, scared).\n4. Khi o.hold là \"phone\" thì vẽ điện thoại nhỏ trong tay. Khi là \"book\" thì vẽ quyển sách.\n5. Luôn có bóng elip mờ dưới chân, mắt chớp theo o.t, thân nhấp nhô nhẹ để trông sống động.\n6. Màu viết sẵn trong code theo đúng hình. Nét viền cùng độ dày như hình (nhân với U). Nhân vật phải nhìn rõ trên nền tối.\n\nQUY TẮC: chỉ dùng canvas thuần, không mạng, không DOM, không eval. Dùng g.save() và g.restore() cho mỗi bộ phận có xoay. Code gọn, dưới khoảng 120 dòng.\n";</script>
